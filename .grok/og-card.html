<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 500 700;
        font-display: block;
        src: url("fonts/f1-_Xms-HUzqDCFdgfMm4S9DQ.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Figtree";
        font-style: normal;
        font-weight: 500 700;
        font-display: block;
        src: url("fonts/f0-_Xms-HUzqDCFdgfMm4q9DbZs.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 500 600;
        font-display: block;
        src: url("fonts/f8-6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0KxC9TeA.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 500 600;
        font-display: block;
        src: url("fonts/f7-6NU78FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0KxCFTeO-U.woff2") format("woff2");
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0c0d0f;
        color: #ecece8;
        overflow: hidden;
        font-family: Figtree, ui-sans-serif, system-ui, sans-serif;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse 48% 62% at 50% 38%, rgb(226 177 60 / 0.22), transparent 58%),
          radial-gradient(ellipse 36% 40% at 50% 72%, rgb(28 122 92 / 0.12), transparent 62%),
          #0c0d0f;
      }
      .radar {
        position: absolute;
        left: 50%;
        top: 46%;
        width: 760px;
        height: 760px;
        transform: translate(-50%, -50%);
        pointer-events: none;
      }
      .lockup {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        width: 760px;
      }
      .coin {
        width: 148px;
        height: 148px;
        filter: drop-shadow(0 22px 48px rgb(0 0 0 / 0.55));
      }
      .kicker {
        margin: 22px 0 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #8a8478;
      }
      h1 {
        margin: 10px 0 0;
        font-family: Fraunces, ui-serif, Georgia, serif;
        font-weight: 500;
        font-size: 92px;
        line-height: 0.88;
        letter-spacing: -0.038em;
        color: #ecece8;
      }
      .tag {
        margin: 18px 0 0;
        font-size: 22px;
        line-height: 1.3;
        color: #8b8d93;
      }
      .pill {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 11px 18px 11px 16px;
        background: rgb(20 21 24 / 0.92);
        box-shadow: 0 0 0 1px rgb(236 236 232 / 0.12);
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
        color: #ecece8;
      }
      .pill-k {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a8478;
      }
      .dot {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #6a6c72;
        flex-shrink: 0;
      }
      .amt {
        font-family: Fraunces, Figtree, ui-serif, sans-serif;
        font-size: 18px;
        letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .soon {
        color: #c45c5c;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg class="radar" viewBox="0 0 760 760" aria-hidden="true">
        <defs>
          <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#e2b13c" stop-opacity="0" />
            <stop offset="100%" stop-color="#e2b13c" stop-opacity="0.34" />
          </linearGradient>
        </defs>
        <circle cx="380" cy="380" r="340" fill="none" stroke="#ecece8" stroke-opacity="0.07" stroke-width="1.5" />
        <circle cx="380" cy="380" r="248" fill="none" stroke="#ecece8" stroke-opacity="0.08" stroke-width="1.5" />
        <circle cx="380" cy="380" r="156" fill="none" stroke="#ecece8" stroke-opacity="0.09" stroke-width="1.5" />
        <line x1="380" y1="28" x2="380" y2="732" stroke="#ecece8" stroke-opacity="0.045" stroke-width="1" />
        <line x1="28" y1="380" x2="732" y2="380" stroke="#ecece8" stroke-opacity="0.045" stroke-width="1" />
        <path d="M380 380 L380 40 A340 340 0 0 1 636 168 Z" fill="url(#sweep)" />
        <circle cx="598" cy="158" r="8" fill="#c45c5c" />
        <circle cx="656" cy="380" r="6" fill="#c4a36a" />
        <circle cx="214" cy="556" r="5.5" fill="#1c7a5c" />
      </svg>
      <div class="lockup">
        <svg class="coin" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="15" fill="#16140f" />
          <circle cx="16" cy="16" r="12.55" fill="#b8862a" />
          <circle cx="16" cy="16" r="12.15" fill="#e2b13c" />
          <circle cx="16" cy="16" r="12.15" fill="none" stroke="#f6d56b" stroke-width="1.05" />
          <path d="M8.4 12.2a8.4 8.4 0 0 1 7.4-5.3" fill="none" stroke="#fff1b8" stroke-width="1.15" stroke-linecap="round" opacity="0.55" />
          <circle cx="16" cy="16" r="7.55" fill="#145a44" />
          <circle cx="16" cy="16" r="7.15" fill="#1c7a5c" />
          <path d="M12.05 10.55h8.15M12.05 14.15h6.35M12.05 10.35v12.2M12.05 14.15L20.05 22.2" fill="none" stroke="#f4fbf7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="23.75" cy="8.85" r="2.7" fill="#9a3d1c" />
          <circle cx="23.75" cy="8.85" r="2.35" fill="#e06c3a" />
        </svg>
        <p class="kicker">Bill & EMI radar</p>
        <h1>Money<br />Mate</h1>
        <p class="tag">See money leave before it leaves.</p>
        <div class="pill">
          <span class="pill-k">Next out</span>
          <span class="dot"></span>
          <span>Car EMI</span>
          <span class="dot"></span>
          <span class="amt">₹11,240</span>
          <span class="dot"></span>
          <span class="soon">3 days</span>
        </div>
      </div>
    </div>
  </body>
</html>
